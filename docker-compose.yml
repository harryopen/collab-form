services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: collabdocs
      POSTGRES_PASSWORD: collabdocs
      POSTGRES_DB: collabdocs
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collabdocs -d collabdocs']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
